<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Illustrated portrait">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6E3B8"/>
      <stop offset="1" stop-color="#EBC987"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#000" stop-opacity=".10"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <circle cx="310" cy="110" r="130" fill="#fff" opacity=".26"/>
  <!-- long hair behind -->
  <path d="M128 230 C118 140 160 104 202 104 C246 104 284 140 272 230 C276 300 290 352 306 410 L96 410 C112 352 124 300 128 230 Z" fill="#17120F"/>
  <!-- shoulders / blouse -->
  <path d="M34 500 C34 408 108 356 200 356 C292 356 366 408 366 500 Z" fill="#2B2623"/>
  <path d="M154 356 C170 400 230 400 246 356 C232 372 168 372 154 356 Z" fill="#3A332F"/>
  <!-- hair falling over shoulders -->
  <path d="M120 300 C112 350 100 388 82 430 C110 442 138 436 150 404 C148 366 140 330 134 300 Z" fill="#17120F"/>
  <path d="M280 300 C288 350 300 388 318 430 C290 442 262 436 250 404 C252 366 260 330 266 300 Z" fill="#17120F"/>
  <!-- neck -->
  <path d="M172 300 L172 364 C184 386 216 386 228 364 L228 300 Z" fill="#B87C56"/>
  <path d="M172 332 C186 352 214 352 228 332 L228 300 L172 300 Z" fill="#000" opacity=".14"/>
  <!-- head -->
  <ellipse cx="200" cy="232" rx="60" ry="76" fill="#C58B63"/>
  <path d="M141 236 C146 296 172 310 200 310 C228 310 254 296 259 236 C254 276 234 290 200 290 C166 290 146 276 141 236 Z" fill="#000" opacity=".09"/>
  <!-- small amber stud earrings -->
  <circle cx="141" cy="252" r="4" fill="#D97706"/>
  <circle cx="259" cy="252" r="4" fill="#D97706"/>
  <!-- fringe with centre part -->
  <path d="M138 226 C134 152 170 128 200 130 C234 128 268 152 262 226 C256 190 236 164 204 148 C172 164 144 190 138 226 Z" fill="#17120F"/>
  <rect width="400" height="500" fill="url(#light)"/>
</svg>
